<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171513"><title>Omar & Donia — Wedding Invitation</title>
<meta name="description" content="Omar & Donia — 20 January 2027, Madar Venue.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ec;--ink:#171513;--muted:#777169;--gold:#b18a55;--line:#ded5c8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",sans-serif;font-weight:300}
.hero{min-height:100svh;position:relative;display:grid;place-items:center;overflow:hidden;background:#201d19}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,10,8,.28),rgba(12,10,8,.56)),url("omar-donia-childhood.jpeg") center 38%/cover no-repeat}
.hero-inner{position:relative;text-align:center;color:#fff;padding:30px 20px;width:100%}
.eyebrow,.kicker{font-size:10px;letter-spacing:.28em;text-transform:uppercase}.eyebrow{margin-bottom:26px;opacity:.9}
.names{font:500 clamp(65px,14vw,122px)/.8 "Cormorant Garamond",serif;margin:0}.amp{font-size:.5em;font-style:italic;color:#e1c89d}
.date{margin-top:30px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}.venue{margin-top:10px;font-size:12px;opacity:.9}
.scroll{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;font-size:9px;letter-spacing:.25em;text-transform:uppercase}.scroll:after{content:"";display:block;height:32px;width:1px;background:#fff;margin:10px auto 0;opacity:.7}
.section{max-width:850px;margin:auto;padding:70px 20px}.center{text-align:center}.kicker{color:var(--gold);margin-bottom:14px}.headline{font:500 clamp(38px,7vw,58px)/.95 "Cormorant Garamond",serif;margin:0 0 20px}
.details{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);margin-top:30px}.detail{padding:30px 14px;border-right:1px solid var(--line)}.detail:last-child{border:0}.detail h3{font:500 28px "Cormorant Garamond",serif;margin:0 0 8px}.detail p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}
.btn{display:inline-block;margin-top:25px;padding:13px 22px;border:1px solid var(--gold);text-decoration:none;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}.btn:hover{background:var(--ink);color:white}
.rsvp{border-top:1px solid var(--line)}.rsvp-frame{margin:25px auto 0;max-width:640px;border:1px solid var(--line);padding:10px;background:#fff;border-radius:3px}.rsvp-frame iframe{width:100%;height:700px;border:0;background:white}.note{font-size:10px;color:var(--muted);margin-top:12px}
footer{text-align:center;padding:36px 20px 55px;color:var(--muted);font-size:9px;letter-spacing:.2em}
@media(max-width:650px){.section{padding:55px 17px}.details{grid-template-columns:1fr}.detail{border-right:0;border-bottom:1px solid var(--line);padding:24px}.detail:last-child{border-bottom:0}.rsvp-frame iframe{height:730px}}
</style></head><body>
<section class="hero"><div class="hero-inner"><div class="eyebrow">You're invited</div><h1 class="names">Omar <span class="amp">&amp;</span> Donia</h1><div class="date">20 January 2027 · 4:00 PM</div><div class="venue">Madar Venue</div></div><div class="scroll">Scroll</div></section>
<section class="section center" id="details"><div class="kicker">Wedding details</div><h2 class="headline">Join us to celebrate</h2><div class="details"><div class="detail"><h3>20 January 2027</h3><p>Wednesday</p></div><div class="detail"><h3>4:00 PM</h3><p>Celebration</p></div><div class="detail"><h3>Madar Venue</h3><p>Cairo</p></div></div><a class="btn" href="https://maps.app.goo.gl/Y1jLPgiRKrfKE5y4A?g_st=ic" target="_blank" rel="noopener">Open location</a></section>
<section class="section center rsvp" id="rsvp"><div class="kicker">RSVP</div><h2 class="headline">Will you join us?</h2><p style="font-size:13px;color:var(--muted);margin:0">Please let us know if you can make it.</p><div class="rsvp-frame"><iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdvAMULtubqGlA-aHWNMHP4nznOoygbsig4dS5Yv2e2G2hMaw/viewform?embedded=true" loading="lazy" title="Wedding RSVP form">Loading…</iframe></div></section>
<footer>OMAR &amp; DONIA · 20 JANUARY 2027</footer></body></html>
